
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Animais</title>

    <style>
        /* Seletor universal */
        * {
            font-family: Arial;
        }

        /* Seletor de tag */
        p {
            color: blue;
        }

        /* Seletor de classe */
        .destaque {
            color: green;
        }

        /* Seletor de identificação */
        #titulo {
            color: red;
        }

        /* Seletor compartilhado */
        h1, h2, h3 {
            text-align: center;
        }

        /* Estilização da imagem */
        img {
            width: 200px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1 id="titulo">Mundo dos Animais</h1>

    <h2>Conheça os animais</h2>

    <img src="https://placedog.net/300/200" alt="Cachorro">

    <p>Os animais são importantes para a natureza.</p>

    <h3 class="destaque">Animais favoritos</h3>

    <p class="destaque">Cachorro, gato e coelho.</p>

</body>
</html>

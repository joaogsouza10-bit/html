<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 400px;
            height: 400px;
            border: 5px solid black;
            text-align: center;
        }

        img {
            width: 100px;
            height: 100px;
            background-color: aqua;
        }

        span {
            font-size: 20px;
            vertical-align: top;
        }

        .item1 {
            width: 150px;
            height: 150px;
            background-color: blueviolet;
            display: inline-block;
        }

        .item2 {
            width: 150px;
            height: 150px;
            background-color: blue;
            display: inline-block;
        }
    </style>

</head>

<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Sapiente enim, nemo tempore dolor aut qui odio unde
            veritatis incidunt voluptatum facere accusamus excepturi pariatur, minima dolore maxime animi quos atque.
        </p>
        <button>Lorem</button>
        <div>
            <img>
            <span>Exemplo vertical-align</span>
        </div>
        <div class="item1">item1</div>
        <div class="item2">item2</div>
    </div>
</body>

</html>

<main>
    <section>
        <h2>glossario</h2>
        <dl>
            <dt>HTML</dt>
            <dd>Linguagem de marcação usada para estruturar páginas na web.</dd>
            <dt>CSS:</dt>
            <dd>folhas de estilos, usadas para definir apeárencias e layout.</dd>
            <dt>JavaScript:</dt>
            <dd>Linguagem de programação usada para adicionar interatividade ás páginas.</dd>
        </dl>
    </section>
    <hr>
    <section>
        <h2>Tabela</h2>
        <table border="1" width="100" height="300" cellpadding="30" cellpadding="30">
            <tr>
                <th colspan="2">nome e idade</th>
            </tr>

            <tr>
                <td rowspan="2" align="center"valign="middle">Raissa</td>
                <td>20</td>
            </tr>

            <tr>
            <!-- <td>Beatriz</td> -->
            <td>19</td>
            </tr>

            <tr>
                <td>José</td>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <section>
        <h2>Formulario</h2>
        <form action="cadastro.php" method="post">
            <p><label>Nome</label>
            <input type="text" nome="nome" placeholder="digite seu nome">
            </p>
            <p><label>Senha:</label>
            <input type="password" name="Senha" required maxlength="8">
            </p>
            <p><label>Telefone</label>
            <input type="text" name="Telefone" pattern="[0-9]{5}-[0-9]{3}" placeholder="(99)00000-000"tequiered>
            </p>
            <p><label>e-mail</label>
            <input type="text" name="e-mail" placeholder="@hotmail.com">
            </p>
            <p><label>CEP:</label>
            <input type="number" name="CEP" required =>
            </p>
            <p><label>Sobro você</label>
            <textarea name="bio" rows="10" cols="100"></textarea>
            </p>
            <p><label>Gênero</label>
            <input type="radio" name="genero" value="M">masculino
            <input type="radio" name="genero" value="F">Feminino
            </p>
            <p><label>Interesses:</label>
            <input type="checkbox" name="Interesses" value="tecnologia">Tecnologia
            <input type="checkbox" name="Interesses" value="esportes">esportes
            <input type="checkbox" name="Interesses" value="arte">arte
            </p>
            <p><label>pais:</label>
            <select name="pais">
                <option value="">----</option>
                <option value="brasil">Brasil</option>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>

            </select>
            </p>
            <p><label>Foto de perfil:</label>
            <input type="file" name="foto">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>


    </section>

</body>

</html>

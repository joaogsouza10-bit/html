<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pseudo-Classes</h1>
    <section>
        <h3>formulario</h3>
        <input type="text" placeholder="selecine para ver o:focus">
        <button>botão com :hover</button>
    </section>
    <section>
        <p>Este é o primeiro parágrafo (deve ficar em negrito pelo :first-child)</p>
    </section>
    <h3>Lista de Itens</h3>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Último Item (deve ficar em vermelho pelo :last-child)</li>
    </ul>
    <section>
        <h3>tabelas com linha alternativas(:nth-child)</h3>
        <table>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
            <tr>
                <td>João</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Carlos</td>
                <td>28</td>
            </tr>
            <tr>
                <td>Ana</td>
                <td>22</td>
            </tr>
        </table>
    </section>
